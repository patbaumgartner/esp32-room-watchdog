name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The espressif32 platform is pinned but PlatformIO Core and its packages are
  # not, so rebuild weekly to catch drift before a contributor does.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      # secrets.h is gitignored; CI only needs it to compile, not to connect.
      - name: Create secrets.h from template
        run: cp src/secrets.h.example src/secrets.h

      - name: Run unit tests (native)
        run: pio test -e native

      - name: Static analysis (cppcheck)
        run: pio check -e esp32-c3-supermini --fail-on-defect=medium --fail-on-defect=high

      - name: Build firmware (esp32-c3-supermini)
        run: pio run -e esp32-c3-supermini

      - name: Upload firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-${{ github.sha }}
          path: .pio/build/esp32-c3-supermini/firmware.bin
          retention-days: 14
