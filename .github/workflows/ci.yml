name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      # secrets.h is gitignored; CI only needs it to compile, not to connect.
      - name: Create secrets.h from template
        run: cp src/secrets.h.example src/secrets.h

      - name: Run unit tests (native)
        run: pio test -e native

      - name: Build firmware (esp32-c3-supermini)
        run: pio run -e esp32-c3-supermini
