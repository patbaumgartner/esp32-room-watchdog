name: Feature request
description: Suggest a sensor, notification, or API capability
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: The situation you hit, not the implementation you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including tuning the existing constants in src/config.h.

  - type: checkboxes
    id: scope
    attributes:
      label: Does this need new hardware?
      options:
        - label: This needs a sensor or component the project does not use today
