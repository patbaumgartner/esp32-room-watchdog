[env:esp32-c3-supermini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Unit tests run on the native env; this env is flash/monitor only.
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
