[env:esp32-c3-supermini]
; Pinned pioarduino release: Arduino-ESP32 3.3.11 / ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.flash_mode = dio
; The async web server stack pushes the default 1.3MB app partition to ~97%
; full. There is no OTA here, so trade the second app slot for headroom.
board_build.partitions = huge_app.csv
; ESP32Async is the maintained successor of me-no-dev/ESPAsyncWebServer, which
; does not build against Arduino-ESP32 3.x.
lib_deps =
    ESP32Async/AsyncTCP@^3.5.0
    ESP32Async/ESPAsyncWebServer@^3.12.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; One telemetry client that must never exhaust RAM: a short queue makes
    ; backpressure show up as dropped frames instead of heap growth.
    -DWS_MAX_QUEUED_MESSAGES=8
    -Wall
    -Wextra
; Unit tests run on the native env; this env is flash/monitor only.
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
; The two environments target incompatible platforms, so always name one:
; `pio run -e esp32-c3-supermini` to build, `pio test -e native` to test.
; src/ is Arduino firmware and cannot compile on the host.
build_src_filter = -<*>
