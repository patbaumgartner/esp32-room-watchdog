[env]
check_tool = cppcheck
check_flags = cppcheck: --enable=warning,style,performance,portability --inline-suppr
check_src_filters = +<src/> +<lib/>
check_skip_packages = yes

[env:esp32-c3-supermini]
; Pinned: the platform version determines the bundled Arduino-ESP32 core, and
; core 3.x drops the legacy ADC DMA API that mic.cpp uses. Bump deliberately.
platform = espressif32@7.0.1
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.flash_mode = dio
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra
; Unit tests run on the native env; this env is flash/monitor only.
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
; The two environments target incompatible platforms, so always name one:
; `pio run -e esp32-c3-supermini` to build, `pio test -e native` to test.
; src/ is Arduino firmware and cannot compile on the host.
build_src_filter = -<*>
